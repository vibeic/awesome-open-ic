name: awesome-lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Run awesome-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reads README.md only. Every entry lives in docs/*.md, so this step says
      # nothing about them — see the next two steps and issue #84.
      - name: Run awesome-lint (README.md)
        run: npx awesome-lint

      # Prove the checker still rejects malformed input before trusting the
      # clean run below. A gate whose predicates have quietly stopped firing
      # produces the same green as one that works.
      - name: Self-test docs checker
        run: python3 tools/lint_docs.py --self-test

      - name: Lint entry files (docs/*.md)
        run: python3 tools/lint_docs.py --root .
