name: link-check

on:
  schedule:
    # Every Monday 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check Markdown links with lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee on Markdown files
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Config (exclusions, retries, accepted codes) lives in lychee.toml,
          # where every exclusion carries its reason and the date it was
          # verified by hand.
          args: --config ./lychee.toml --verbose "**/*.md"
          fail: true
          output: ./lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md
          if-no-files-found: ignore

      # ONE issue, updated in place — not a new one every Monday.
      #
      # Nine issues with an identical title were opened weekly between
      # 2026-05-25 and 2026-07-20 and not one was ever closed or acted on (#76
      # consolidates them). A duplicate a week is how a real alert becomes
      # unreadable: by the ninth copy the signal is indistinguishable from the
      # noise it is buried in, and the six errors that WERE ours went unfixed
      # for ten weeks.
      #
      # Updating in place also makes the issue's age the age of the OLDEST
      # unfixed link — the number a maintainer actually needs, and the one the
      # weekly-reopen pattern destroyed.
      - name: Find the existing open link-check report
        if: failure()
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --label link-check --limit 1 --json number --jq '.[0].number // ""')
          echo "number=$n" >> "$GITHUB_OUTPUT"
          if [ -n "$n" ]; then
            echo "updating existing report #$n"
          else
            echo "no open report — a new one will be opened"
          fi

      - name: Open or update the dead-link report
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          # Empty means "create"; a number means "update in place".
          issue-number: ${{ steps.existing.outputs.number }}
          title: "Dead links found by weekly link-check"
          content-filepath: ./lychee/out.md
          labels: |
            link-check
            automated
